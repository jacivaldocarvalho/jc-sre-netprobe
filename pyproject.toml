[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "jc-sre-netprobe"
version = "0.1.0"
description = "Network health checks and utilities for Telecom, DevOps and SRE."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"


authors = [
    { name = "Jacivaldo Carvalho", email = "jacivaldocarvalho@gmail.com" }
]

keywords = [
    "networking",
    "telecom",
    "devops",
    "sre",
    "observability",
    "network-monitoring",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]


dependencies = [
    "httpx>=0.27,<1",
]

[project.scripts]
jc-sre-netprobe = "jc_sre_netprobe.cli:cli"

[project.urls]
Homepage = "https://jacivaldocarvalho.com"
Repository = "https://github.com/jacivaldocarvalho/jc-sre-netprobe"
Issues = "https://github.com/jacivaldocarvalho/jc-sre-netprobe/issues"


[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
    "twine>=6,<7",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88


[tool.mypy]
python_version = "3.11"
strict = true
